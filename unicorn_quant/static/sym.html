<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品种复盘 · 独角兽量化</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23007AFF'/%3E%3Cpath d='M9 22l3-12 4 7 4-9 3 14z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=13ti">
<link rel="stylesheet" href="/static/best.css?v=5ti">
<link rel="stylesheet" href="/static/universe.css?v=3">
</head>
<body>
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<header class="nav">
  <a class="brand" href="/">
    <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#007AFF"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#lg)"/><path d="M8.5 22.5l3.2-12.5 4.3 7.4 4.3-9.4 3.2 14.5z" fill="#fff"/></svg>
    <span>独角兽量化</span>
  </a>
  <nav class="pills"><a href="/">图表与回测</a><a href="/best">最优方案</a><a class="on" href="/universe">全品种复盘</a></nav>
  <div class="nav-right"><button class="chip ghost" id="themeBtn" title="切换主题">◐</button></div>
</header>

<main class="bp up">
  <div class="crumb"><a href="/universe">← 全品种复盘</a><span class="sp"></span>
    <select id="jump" title="切换品种"></select><button class="chip sm" id="prevSym">‹</button><button class="chip sm" id="nextSym">›</button>
    <a class="chip sm" id="wbLink" href="/">在工作台打开</a></div>

  <section class="hero sh">
    <div class="hero-l">
      <div class="symh"><i class="av big" id="av"></i><div><h1 id="title">--</h1><div class="mut" id="sub"></div></div></div>
      <div class="bds" id="badges"></div>
      <div class="pendl" id="pendl" hidden></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="card pad" id="kCard">
    <div class="sec-h"><div><b>K 线 · 主方案每一笔开平仓</b><span class="mut small" id="kSub"></span></div>
      <div class="ctl">
        <div class="seg" id="legSeg"></div>
        <div class="seg" id="rngSeg"><button data-v="365">1年</button><button data-v="1095" class="on">3年</button><button data-v="0">全部</button></div>
        <button class="chip sm" id="logBtn" title="对数刻度">对数</button>
        <button class="chip sm" id="fsBtn" title="全屏(F 键)">⛶ 全屏</button>
      </div></div>
    <div class="klgd small mut" id="klgd"></div>
    <div class="kwrap"><div id="kc" class="kc2"></div><div class="kinfo" id="kinfo"></div></div>
    <div class="evt small" id="evt"><span class="mut">把鼠标移到 K 线上看当天的开平仓原因；点下面交易表的任意一行，K 线会跳到那一笔。</span></div>
  </section>

  <div class="two">
    <section class="card pad">
      <div class="sec-h"><div><b>单独只做它 vs 买入持有</b><span class="mut small" id="eqSub">起点 = 1，对数刻度</span></div></div>
      <div id="eqc" class="eqc2"></div>
      <div class="klgd small" id="eqLgd"></div>
    </section>
    <section class="card pad">
      <div class="sec-h"><div><b>逐年</b><span class="mut small">按平仓年份统计</span></div></div>
      <div class="tbl-wrap"><table class="t" id="yTbl"></table></div>
    </section>
  </div>

  <section class="card pad">
    <div class="sec-h"><div><b>全部交易</b><span class="mut small" id="tSub"></span></div>
      <div class="ctl"><select id="fRes"><option value="">全部结果</option><option value="w">盈利</option><option value="l">亏损</option><option value="o">持仓中</option></select></div></div>
    <div class="tbl-wrap"><table class="t trades st" id="tTbl"></table></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/sym.js?v=5e"></script>
</body>
</html>

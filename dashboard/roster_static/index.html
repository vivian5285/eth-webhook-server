<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>擂台 · 策略对比</title>
<style>
  :root{
    color-scheme: light dark;
    --bg: #f5f5f7;
    --bg-blob-1: #7dd3fc;
    --bg-blob-2: #c4b5fd;
    --bg-blob-3: #fbcfe8;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --ink-faint: #86868b;
    --glass: rgba(255,255,255,0.62);
    --glass-strong: rgba(255,255,255,0.78);
    --glass-border: rgba(255,255,255,0.9);
    --hairline: rgba(0,0,0,0.08);
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.12);
    --good: #1fa257;
    --good-soft: rgba(31,162,87,0.12);
    --bad: #ff3b30;
    --bad-soft: rgba(255,59,48,0.1);
    --shadow: 0 8px 32px rgba(31,41,55,0.10), 0 1px 2px rgba(31,41,55,0.06);
    --shadow-lg: 0 24px 64px rgba(31,41,55,0.18), 0 2px 8px rgba(31,41,55,0.08);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --bg-blob-1: #0b3a5c;
      --bg-blob-2: #3a2a5c;
      --bg-blob-3: #4a1f33;
      --ink: #f5f5f7;
      --ink-soft: #a1a1a6;
      --ink-faint: #6e6e73;
      --glass: rgba(28,28,30,0.60);
      --glass-strong: rgba(38,38,40,0.78);
      --glass-border: rgba(255,255,255,0.08);
      --hairline: rgba(255,255,255,0.09);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.18);
      --good: #32d74b;
      --good-soft: rgba(50,215,75,0.15);
      --bad: #ff453a;
      --bad-soft: rgba(255,69,58,0.15);
      --shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #000000;
    --bg-blob-1: #0b3a5c;
    --bg-blob-2: #3a2a5c;
    --bg-blob-3: #4a1f33;
    --ink: #f5f5f7;
    --ink-soft: #a1a1a6;
    --ink-faint: #6e6e73;
    --glass: rgba(28,28,30,0.60);
    --glass-strong: rgba(38,38,40,0.78);
    --glass-border: rgba(255,255,255,0.08);
    --hairline: rgba(255,255,255,0.09);
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.18);
    --good: #32d74b;
    --good-soft: rgba(50,215,75,0.15);
    --bad: #ff453a;
    --bad-soft: rgba(255,69,58,0.15);
    --shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  .blobs{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    filter: blur(90px) saturate(130%);
    opacity: 0.55;
  }
  :root[data-theme="dark"] .blobs, @media (prefers-color-scheme: dark){ .blobs{ opacity: 0.4; } }
  .blob{ position: absolute; border-radius: 50%; }
  .blob-1{ width: 520px; height: 520px; top: -160px; left: -120px; background: var(--bg-blob-1); }
  .blob-2{ width: 460px; height: 460px; top: 10%; right: -140px; background: var(--bg-blob-2); }
  .blob-3{ width: 420px; height: 420px; bottom: -180px; left: 30%; background: var(--bg-blob-3); }

  .wrap{ position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

  header.topbar{
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: var(--glass-strong);
    border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner{
    max-width: 1180px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand{ display:flex; align-items:baseline; gap: 10px; }
  .brand h1{ font-size: 20px; font-weight: 650; margin:0; letter-spacing: -0.01em; }
  .brand span.sub{ font-size: 13px; color: var(--ink-soft); }
  .status-pill{
    display:flex; align-items:center; gap:7px;
    font-size: 12.5px; color: var(--ink-soft);
    background: var(--glass); border: 1px solid var(--glass-border);
    padding: 6px 12px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .dot.stale{ background: var(--ink-faint); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }

  .hero{ padding: 40px 0 8px; }
  .hero h2{
    font-size: 34px; font-weight: 680; letter-spacing: -0.02em; margin: 0 0 6px;
    text-wrap: balance;
  }
  .hero p{ margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 60ch; }

  .stat-row{
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    margin: 28px 0 36px;
  }
  .stat-card{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  .stat-card .label{ font-size: 12.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card .value{ font-size: 26px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat-card .value.good{ color: var(--good); }
  .stat-card .value.bad{ color: var(--bad); }

  .section-title{
    font-size: 13px; font-weight: 650; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 8px 4px 14px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .card-top{ display:flex; align-items:flex-start; justify-content: space-between; gap: 10px; }
  .card-name{ font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .card-rank{
    font-size: 11px; font-weight: 700; color: var(--ink-faint);
    background: rgba(0,0,0,0.05); border-radius: 999px; padding: 3px 8px;
    font-variant-numeric: tabular-nums;
  }
  :root[data-theme="dark"] .card-rank, @media (prefers-color-scheme: dark){ .card-rank{ background: rgba(255,255,255,0.08); } }
  .card-desc{
    font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 39px;
  }
  .card-return{
    font-size: 30px; font-weight: 700; margin-top: 14px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .card-return.good{ color: var(--good); }
  .card-return.bad{ color: var(--bad); }
  .card-return.flat{ color: var(--ink-faint); }
  .card-stats{
    display: flex; gap: 16px; margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }
  .mini-stat{ font-size: 12px; color: var(--ink-faint); }
  .mini-stat b{ display:block; font-size: 14px; color: var(--ink); font-weight: 620; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .chip-open{
    display:inline-flex; align-items:center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; margin-top: 12px;
  }

  /* Detail overlay */
  .overlay{
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .overlay.show{ opacity: 1; pointer-events: auto; }
  .sheet{
    width: 100%; max-width: 840px; max-height: 86vh;
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 28px 28px 0 0;
    box-shadow: var(--shadow-lg);
    padding: 26px 26px 34px;
    overflow-y: auto;
    transform: translateY(24px);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.show .sheet{ transform: translateY(0); }
  @media (min-width: 720px){
    .overlay{ align-items: center; }
    .sheet{ border-radius: 28px; }
  }
  .sheet-head{ display:flex; align-items:flex-start; justify-content: space-between; gap: 12px; }
  .sheet-title{ font-size: 22px; font-weight: 680; letter-spacing: -0.01em; }
  .sheet-desc{ color: var(--ink-soft); font-size: 13.5px; margin-top: 6px; line-height: 1.55; }
  .close-btn{
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.06); color: var(--ink-soft);
    font-size: 15px; cursor: pointer; flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
  }
  :root[data-theme="dark"] .close-btn, @media (prefers-color-scheme: dark){ .close-btn{ background: rgba(255,255,255,0.1); } }
  .tabs{ display:flex; gap: 6px; margin: 20px 0 16px; }
  .tab-btn{
    font-size: 13px; font-weight: 560; padding: 7px 14px; border-radius: 999px;
    border: 1px solid transparent; background: rgba(0,0,0,0.05); color: var(--ink-soft);
    cursor: pointer;
  }
  :root[data-theme="dark"] .tab-btn, @media (prefers-color-scheme: dark){ .tab-btn{ background: rgba(255,255,255,0.08); } }
  .tab-btn.active{ background: var(--accent); color: #fff; }

  table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  th{ text-align: left; color: var(--ink-faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; }
  td{ padding: 10px; border-top: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  tr:hover td{ background: rgba(0,0,0,0.02); }
  :root[data-theme="dark"] tr:hover td, @media (prefers-color-scheme: dark){ tr:hover td{ background: rgba(255,255,255,0.03); } }
  .table-wrap{ overflow-x: auto; border-radius: 14px; border: 1px solid var(--hairline); }
  .num.good{ color: var(--good); font-weight: 600; }
  .num.bad{ color: var(--bad); font-weight: 600; }
  .empty-note{ color: var(--ink-faint); font-size: 13px; padding: 24px 4px; text-align:center; }

  .loading-row{ color: var(--ink-faint); font-size: 13px; padding: 40px; text-align:center; }

  footer{ text-align:center; color: var(--ink-faint); font-size: 12px; padding: 40px 0 10px; }

  @media (max-width: 720px){
    .stat-row{ grid-template-columns: repeat(2,1fr); }
    .hero h2{ font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>擂台</h1>
        <span class="sub">策略对比 · 纸面模拟</span>
      </div>
      <div class="status-pill" id="statusPill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">连接中…</span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="hero">
      <h2 id="heroTitle">公开战法，同台竞技</h2>
      <p>纯纸面模拟，不碰真实资金——每套策略从 $1,000 起步，同一套仓位公式，公平对照谁的信号质量更好。</p>
    </div>

    <div class="stat-row" id="statRow">
      <div class="stat-card"><div class="label">策略数</div><div class="value" id="statStrategies">–</div></div>
      <div class="stat-card"><div class="label">品种数</div><div class="value" id="statSymbols">–</div></div>
      <div class="stat-card"><div class="label">领先策略</div><div class="value" id="statBest" style="font-size:18px;">–</div></div>
      <div class="stat-card"><div class="label">起始净值</div><div class="value" id="statEquity">–</div></div>
    </div>

    <div class="section-title">按收益率排名</div>
    <div class="grid" id="cardGrid">
      <div class="loading-row">加载中…</div>
    </div>

    <footer>擂台数据每 30 秒自动刷新 · 独立于实盘账户，不共享任何持仓/资金状态</footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="sheetTitle">—</div>
          <div class="sheet-desc" id="sheetDesc"></div>
        </div>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="symbols">按品种</button>
        <button class="tab-btn" data-tab="open">持仓中</button>
        <button class="tab-btn" data-tab="closed">最近平仓</button>
      </div>

      <div id="tabBody"><div class="loading-row">加载中…</div></div>
    </div>
  </div>

<script>
const API = {
  meta: '/api/roster/meta',
  compare: '/api/roster/compare',
  symbols: s => `/api/roster/compare/${encodeURIComponent(s)}/symbols`,
  positions: (s, status) => `/api/roster/compare/${encodeURIComponent(s)}/positions?status=${status}&limit=50`,
};

let currentStrategy = null;
let currentTab = 'symbols';
let lastLoadOk = false;

function fmtPct(v){
  if (v === null || v === undefined) return '–';
  const s = v > 0 ? '+' : '';
  return `${s}${v.toFixed(2)}%`;
}
function fmtUsd(v){
  if (v === null || v === undefined) return '–';
  const s = v > 0 ? '+' : '';
  return `${s}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/^/, v<0?'-':'')}`;
}
function fmtUsdSimple(v){
  if (v === null || v === undefined) return '–';
  const sign = v >= 0 ? '+' : '-';
  return `${sign}$${Math.abs(v).toFixed(2)}`;
}
function toneClass(v){
  if (v === null || v === undefined || v === 0) return 'flat';
  return v > 0 ? 'good' : 'bad';
}

async function loadMeta(){
  try{
    const r = await fetch(API.meta);
    const d = await r.json();
    document.getElementById('statStrategies').textContent = d.strategy_count ?? '–';
    document.getElementById('statSymbols').textContent = d.symbol_count ?? '–';
    document.getElementById('statEquity').textContent = d.starting_equity ? `$${d.starting_equity.toLocaleString()}` : '–';
    if (d.strategy_count){
      document.getElementById('heroTitle').textContent = `${d.strategy_count}套公开战法，同台竞技`;
    }
  }catch(e){ /* 顶部stat卡不阻塞主流程 */ }
}

async function loadCompare(){
  const grid = document.getElementById('cardGrid');
  try{
    const r = await fetch(API.compare);
    const d = await r.json();
    const rows = d.strategies || [];
    lastLoadOk = true;
    setStatus(true);

    if (rows.length){
      const best = rows[0];
      document.getElementById('statBest').textContent = best.strategy;
    }

    grid.innerHTML = rows.map((row, i) => {
      const ret = row.equity_return_pct;
      const tone = toneClass(ret);
      const openBadge = row.open_count > 0
        ? `<div class="chip-open">● ${row.open_count} 笔持仓中</div>` : '';
      return `
        <div class="card" data-strategy="${row.strategy}">
          <div class="card-top">
            <div class="card-name">${row.strategy}</div>
            <div class="card-rank">#${i+1}</div>
          </div>
          <div class="card-desc">${row.description || '暂无说明'}</div>
          <div class="card-return ${tone}">${fmtPct(ret)}</div>
          <div class="card-stats">
            <div class="mini-stat">胜率<b>${row.win_rate != null ? row.win_rate + '%' : '–'}</b></div>
            <div class="mini-stat">已平仓<b>${row.trades ?? 0}</b></div>
            <div class="mini-stat">净值<b>$${(row.equity ?? 0).toLocaleString(undefined,{maximumFractionDigits:0})}</b></div>
          </div>
          ${openBadge}
        </div>`;
    }).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openSheet(card.dataset.strategy, rows.find(r => r.strategy === card.dataset.strategy)));
    });
  }catch(e){
    setStatus(false);
    if (!lastLoadOk){
      grid.innerHTML = '<div class="empty-note">暂时连不上擂台服务，稍后自动重试…</div>';
    }
  }
}

function setStatus(ok){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (ok){
    dot.classList.remove('stale');
    text.textContent = '实时 · ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  } else {
    dot.classList.add('stale');
    text.textContent = '连接中断';
  }
}

function openSheet(strategy, row){
  currentStrategy = strategy;
  currentTab = 'symbols';
  document.getElementById('sheetTitle').textContent = strategy;
  document.getElementById('sheetDesc').textContent = row ? (row.description || '') : '';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'symbols'));
  document.getElementById('overlay').classList.add('show');
  loadTab();
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}

async function loadTab(){
  const body = document.getElementById('tabBody');
  body.innerHTML = '<div class="loading-row">加载中…</div>';
  if (!currentStrategy) return;

  if (currentTab === 'symbols'){
    const r = await fetch(API.symbols(currentStrategy));
    const d = await r.json();
    const rows = d.symbols || [];
    if (!rows.length){ body.innerHTML = '<div class="empty-note">这套策略还没有已平仓的品种数据</div>'; return; }
    body.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>品种</th><th>笔数</th><th>胜率</th><th>累计盈亏</th></tr></thead>
      <tbody>${rows.map(s => {
        const wr = s.trades ? Math.round(100*(s.wins||0)/s.trades) : null;
        return `<tr><td>${s.symbol}</td><td>${s.trades}</td><td>${wr!=null? wr+'%':'–'}</td>
          <td class="num ${toneClass(s.total_pnl_usd)}">${fmtUsdSimple(s.total_pnl_usd)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  } else {
    const status = currentTab === 'open' ? 'open' : 'closed';
    const r = await fetch(API.positions(currentStrategy, status));
    const d = await r.json();
    const rows = d.positions || [];
    if (!rows.length){ body.innerHTML = `<div class="empty-note">暂无${status==='open'?'持仓中':'已平仓'}记录</div>`; return; }
    if (status === 'open'){
      body.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>品种</th><th>方向</th><th>入场价</th><th>现价</th><th>浮动盈亏</th></tr></thead>
        <tbody>${rows.map(p => `<tr><td>${p.symbol}</td><td>${p.side}</td><td>${p.entry}</td>
          <td>${p.current_price ?? '–'}</td>
          <td class="num ${toneClass(p.unrealized_pnl_usd)}">${fmtUsdSimple(p.unrealized_pnl_usd)}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      body.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>品种</th><th>方向</th><th>入场价</th><th>出场价</th><th>出场原因</th><th>盈亏</th></tr></thead>
        <tbody>${rows.map(p => {
          const pnl = p.realized_pnl_atr_weighted != null && p.atr0 && p.qty ? p.realized_pnl_atr_weighted*p.atr0*p.qty : null;
          return `<tr><td>${p.symbol}</td><td>${p.side}</td><td>${p.entry}</td><td>${p.exit_price ?? '–'}</td>
            <td>${p.exit_reason || '–'}</td>
            <td class="num ${toneClass(pnl)}">${fmtUsdSimple(pnl)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    }
  }
}

document.getElementById('closeBtn').addEventListener('click', closeSheet);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    loadTab();
  });
});

loadMeta();
loadCompare();
setInterval(loadCompare, 30000);
</script>
</body>

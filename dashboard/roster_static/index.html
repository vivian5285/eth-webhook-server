<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>擂台 · 策略对比</title>
<style>
  :root{
    color-scheme: light dark;
    --bg: #f5f5f7;
    --bg-blob-1: #7dd3fc;
    --bg-blob-2: #c4b5fd;
    --bg-blob-3: #fbcfe8;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --ink-faint: #86868b;
    --glass: rgba(255,255,255,0.62);
    --glass-strong: rgba(255,255,255,0.78);
    --glass-border: rgba(255,255,255,0.9);
    --hairline: rgba(0,0,0,0.08);
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.12);
    --good: #1fa257;
    --good-soft: rgba(31,162,87,0.12);
    --bad: #ff3b30;
    --bad-soft: rgba(255,59,48,0.1);
    --shadow: 0 8px 32px rgba(31,41,55,0.10), 0 1px 2px rgba(31,41,55,0.06);
    --shadow-lg: 0 24px 64px rgba(31,41,55,0.18), 0 2px 8px rgba(31,41,55,0.08);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000; --bg-blob-1:#0b3a5c; --bg-blob-2:#3a2a5c; --bg-blob-3:#4a1f33;
      --ink:#f5f5f7; --ink-soft:#a1a1a6; --ink-faint:#6e6e73;
      --glass: rgba(28,28,30,0.60); --glass-strong: rgba(38,38,40,0.80);
      --glass-border: rgba(255,255,255,0.08); --hairline: rgba(255,255,255,0.09);
      --accent:#0a84ff; --accent-soft: rgba(10,132,255,0.18);
      --good:#32d74b; --good-soft: rgba(50,215,75,0.15);
      --bad:#ff453a; --bad-soft: rgba(255,69,58,0.15);
      --shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #000000; --bg-blob-1:#0b3a5c; --bg-blob-2:#3a2a5c; --bg-blob-3:#4a1f33;
    --ink:#f5f5f7; --ink-soft:#a1a1a6; --ink-faint:#6e6e73;
    --glass: rgba(28,28,30,0.60); --glass-strong: rgba(38,38,40,0.80);
    --glass-border: rgba(255,255,255,0.08); --hairline: rgba(255,255,255,0.09);
    --accent:#0a84ff; --accent-soft: rgba(10,132,255,0.18);
    --good:#32d74b; --good-soft: rgba(50,215,75,0.15);
    --bad:#ff453a; --bad-soft: rgba(255,69,58,0.15);
    --shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh; overflow: hidden; position: relative;
  }
  .blobs{ position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(90px) saturate(130%); opacity: 0.5; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blobs{ opacity: 0.35; } }
  :root[data-theme="dark"] .blobs{ opacity: 0.35; }
  .blob{ position: absolute; border-radius: 50%; }
  .blob-1{ width: 480px; height: 480px; top: -160px; left: -100px; background: var(--bg-blob-1); }
  .blob-2{ width: 420px; height: 420px; bottom: -160px; right: -120px; background: var(--bg-blob-2); }
  .blob-3{ width: 360px; height: 360px; top: 40%; left: 40%; background: var(--bg-blob-3); }

  .app{ position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

  header.topbar{
    flex: 0 0 auto;
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: var(--glass-strong); border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner{ padding: 14px 24px; display:flex; align-items:center; justify-content: space-between; gap:16px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size: 19px; font-weight: 650; margin:0; letter-spacing: -0.01em; }
  .brand span.sub{ font-size: 12.5px; color: var(--ink-soft); }
  .top-stats{ display:flex; gap: 22px; }
  .top-stat{ font-size: 12px; color: var(--ink-faint); text-align: right; }
  .top-stat b{ display:block; font-size: 15px; color: var(--ink); font-weight: 640; font-variant-numeric: tabular-nums; }
  .status-pill{
    display:flex; align-items:center; gap:7px; font-size: 12px; color: var(--ink-soft);
    background: var(--glass); border: 1px solid var(--glass-border); padding: 5px 11px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .dot.stale{ background: var(--ink-faint); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }

  .body-row{ flex: 1 1 auto; display:flex; min-height: 0; }

  aside.sidebar{
    flex: 0 0 300px; max-width: 300px;
    border-right: 1px solid var(--hairline);
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    overflow-y: auto; padding: 14px 10px 24px;
  }
  .sidebar-label{ font-size: 11.5px; font-weight: 650; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 10px 10px; }
  .category-toggle{
    display:flex; gap: 4px; padding: 4px; margin: 2px 6px 12px;
    background: rgba(0,0,0,0.05); border-radius: 12px;
  }
  @media (prefers-color-scheme: dark){ .category-toggle{ background: rgba(255,255,255,0.07); } }
  :root[data-theme="dark"] .category-toggle{ background: rgba(255,255,255,0.07); }
  .cat-btn{
    flex: 1 1 0; border: none; background: transparent; color: var(--ink-soft);
    font-size: 12.5px; font-weight: 600; padding: 8px 6px; border-radius: 9px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .cat-btn.active{ background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }
  .view-toggle{ display:flex; gap: 4px; padding: 3px; margin: 0 6px 12px; background: rgba(0,0,0,0.04); border-radius: 11px; }
  @media (prefers-color-scheme: dark){ .view-toggle{ background: rgba(255,255,255,0.05); } }
  :root[data-theme="dark"] .view-toggle{ background: rgba(255,255,255,0.05); }
  .view-btn{ flex:1 1 0; border:none; background:transparent; color: var(--ink-soft); font-size: 11.5px; font-weight: 600; padding: 6px 4px; border-radius: 8px; cursor: pointer; transition: background .15s, color .15s; }
  .view-btn.active{ background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }
  .wallet-addr{ font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge-live{
    display:inline-flex; align-items:center; gap:5px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-faint); background: rgba(0,0,0,0.05); border-radius: 999px; padding: 4px 10px;
  }
  @media (prefers-color-scheme: dark){ .badge-live{ background: rgba(255,255,255,0.08); } }
  :root[data-theme="dark"] .badge-live{ background: rgba(255,255,255,0.08); }
  .strat-row{
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 11px 12px; border-radius: 12px; cursor: pointer; margin-bottom: 3px;
    transition: background 0.15s;
  }
  .strat-row:hover{ background: rgba(0,0,0,0.045); }
  @media (prefers-color-scheme: dark){ .strat-row:hover{ background: rgba(255,255,255,0.06); } }
  :root[data-theme="dark"] .strat-row:hover{ background: rgba(255,255,255,0.06); }
  .strat-row.active{ background: var(--accent-soft); }
  .strat-main{ min-width: 0; }
  .strat-rank{ font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .strat-name{ font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strat-open{ font-size: 10.5px; color: var(--accent); margin-top: 1px; }
  .strat-side{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; }
  .strat-ret{ font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .strat-ret.good{ color: var(--good); }
  .strat-ret.bad{ color: var(--bad); }
  .strat-ret.flat{ color: var(--ink-faint); }
  .strat-eq{ font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  main.detail{ flex: 1 1 auto; overflow-y: auto; padding: 28px 32px 60px; }
  .detail-inner{ max-width: 880px; }

  .detail-head{ display:flex; align-items:flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .detail-title{ font-size: 26px; font-weight: 680; letter-spacing: -0.01em; text-wrap: balance; }
  .detail-desc{ color: var(--ink-soft); font-size: 14px; margin-top: 8px; line-height: 1.6; max-width: 62ch; }

  .kpi-row{ display:grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 24px 0 8px; }
  .kpi-card{
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px;
  }
  .kpi-card .label{ font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-card .value{ font-size: 22px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi-card .value.good{ color: var(--good); }
  .kpi-card .value.bad{ color: var(--bad); }

  .tabs{ display:flex; gap: 6px; margin: 26px 0 16px; }
  .tab-btn{
    font-size: 13px; font-weight: 560; padding: 7px 15px; border-radius: 999px;
    border: 1px solid transparent; background: rgba(0,0,0,0.05); color: var(--ink-soft); cursor: pointer;
  }
  @media (prefers-color-scheme: dark){ .tab-btn{ background: rgba(255,255,255,0.08); } }
  :root[data-theme="dark"] .tab-btn{ background: rgba(255,255,255,0.08); }
  .tab-btn.active{ background: var(--accent); color: #fff; }

  table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  th{ text-align: left; color: var(--ink-faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 9px 12px; position: sticky; top:0; background: var(--glass-strong); backdrop-filter: blur(12px); }
  td{ padding: 10px 12px; border-top: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  tr:hover td{ background: rgba(0,0,0,0.02); }
  @media (prefers-color-scheme: dark){ tr:hover td{ background: rgba(255,255,255,0.03); } }
  :root[data-theme="dark"] tr:hover td{ background: rgba(255,255,255,0.03); }
  .table-wrap{
    overflow: auto; max-height: 46vh; border-radius: 14px; border: 1px solid var(--hairline);
    background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .num.good{ color: var(--good); font-weight: 600; }
  .num.bad{ color: var(--bad); font-weight: 600; }
  .empty-note{ color: var(--ink-faint); font-size: 13px; padding: 34px 4px; text-align:center; }
  .loading-row{ color: var(--ink-faint); font-size: 13px; padding: 40px; text-align:center; }

  @media (max-width: 860px){
    .body-row{ flex-direction: column; }
    aside.sidebar{ flex: 0 0 auto; max-width: none; max-height: 40vh; border-right:none; border-bottom: 1px solid var(--hairline); }
    main.detail{ padding: 20px 18px 50px; }
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
    .top-stats{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>擂台</h1>
          <span class="sub" id="heroSub">策略对比 · 纸面模拟</span>
        </div>
        <div style="display:flex; align-items:center; gap:22px;">
          <div class="top-stats" id="topStats">
            <div class="top-stat">策略数<b id="statStrategies">–</b></div>
            <div class="top-stat">品种数<b id="statSymbols">–</b></div>
            <div class="top-stat">起始净值<b id="statEquity">–</b></div>
          </div>
          <div class="status-pill" id="statusPill">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
          </div>
        </div>
      </div>
    </header>

    <div class="body-row">
      <aside class="sidebar">
        <div class="category-toggle">
          <button class="cat-btn active" data-cat="cex">中心化交易所</button>
          <button class="cat-btn" data-cat="chain">链上数据</button>
        </div>
        <div class="view-toggle" id="viewToggle">
          <button class="view-btn active" data-view="strategy">按策略</button>
          <button class="view-btn" data-view="symbol">按币种</button>
          <button class="view-btn" data-view="stock">按美股</button>
        </div>
        <div class="sidebar-label" id="sidebarLabel">按收益率排名</div>
        <div id="sidebarList"><div class="loading-row">加载中…</div></div>
      </aside>

      <main class="detail">
        <div class="detail-inner" id="detailInner">
          <div class="loading-row">加载中…</div>
        </div>
      </main>
    </div>
  </div>

<script>
const API = {
  meta: '/api/roster/meta',
  compare: '/api/roster/compare',
  symbols: s => `/api/roster/compare/${encodeURIComponent(s)}/symbols`,
  positions: (s, status) => `/api/roster/compare/${encodeURIComponent(s)}/positions?status=${status}&limit=80`,
  symbolsCompare: '/api/roster/symbols_compare',
  symbolStrategies: s => `/api/roster/symbol/${encodeURIComponent(s)}/strategies`,
  symbolPositions: (s, status) => `/api/roster/symbol/${encodeURIComponent(s)}/positions?status=${status}&limit=80`,
  chainOverview: '/api/chain/overview',
  chainWallets: '/api/chain/wallets',
  chainPositions: status => `/api/chain/positions?status=${status}&limit=80`,
};

let rosterRows = [];
let currentStrategy = null;
let currentTab = 'symbols';
let lastLoadOk = false;
let currentCategory = 'cex';
let cexView = 'strategy';        // 'strategy' | 'symbol' | 'stock'
let symbolRows = [];
let currentSymbol = null;
let currentSymTab = 'strategies'; // 'strategies' | 'open' | 'closed'
// 已经渲染出详情面板的是哪个策略/币——用来判断 30s 自动刷新时该"整块重建"
// 还是"只就地更新数字+静默刷新当前 tab"，避免每次刷新把用户正在看的内容
// 打回"加载中…"。tabSeq 防止慢响应把新响应覆盖掉(看起来也像"不稳定")。
let renderedStrategy = null;
let renderedSymbol = null;
let tabSeq = 0;
let chainOverview = null;
let chainWallets = [];
let currentWallet = null; // null = 总览, otherwise "address|chain" key

function fmtPct(v){
  if (v === null || v === undefined) return '–';
  const s = v > 0 ? '+' : '';
  return `${s}${v.toFixed(2)}%`;
}
function fmtUsdSimple(v){
  if (v === null || v === undefined) return '–';
  const sign = v >= 0 ? '+' : '-';
  return `${sign}$${Math.abs(v).toFixed(2)}`;
}
function fmtUsd0(v){
  if (v === null || v === undefined) return '–';
  return `$${Number(v).toLocaleString(undefined,{maximumFractionDigits:0})}`;
}
// epoch ms -> "MM-DD HH:mm"（浏览器本地时区，宝贝在 UTC+8）
function fmtTime(ms){
  if (!ms) return '–';
  const d = new Date(Number(ms));
  if (isNaN(d.getTime())) return '–';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toneClass(v){
  if (v === null || v === undefined || v === 0) return 'flat';
  return v > 0 ? 'good' : 'bad';
}

async function loadMeta(){
  try{
    const r = await fetch(API.meta);
    const d = await r.json();
    document.getElementById('statStrategies').textContent = d.strategy_count ?? '–';
    document.getElementById('statSymbols').textContent = d.symbol_count ?? '–';
    document.getElementById('statEquity').textContent = d.starting_equity ? `$${d.starting_equity.toLocaleString()}` : '–';
    if (d.strategy_count){
      document.getElementById('heroSub').textContent = `${d.strategy_count}套公开战法 · 纸面模拟`;
    }
  }catch(e){ /* 不阻塞主流程 */ }
}

function renderSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = rosterRows.map((row, i) => {
    const ret = row.equity_return_pct;
    const tone = toneClass(ret);
    const active = row.strategy === currentStrategy ? 'active' : '';
    const openTag = row.open_count > 0 ? `<div class="strat-open">● ${row.open_count} 笔持仓中</div>` : '';
    return `
      <div class="strat-row ${active}" data-strategy="${row.strategy}">
        <div class="strat-main">
          <div class="strat-rank">#${i+1}</div>
          <div class="strat-name">${row.strategy}</div>
          ${openTag}
        </div>
        <div class="strat-side">
          <div class="strat-ret ${tone}">${fmtPct(ret)}</div>
          <div class="strat-eq">${fmtUsd0(row.equity)}</div>
        </div>
      </div>`;
  }).join('');
  list.querySelectorAll('.strat-row').forEach(el => {
    el.addEventListener('click', () => selectStrategy(el.dataset.strategy));
  });
}

// ── "按币种" / "按美股" 视图 ─────────────────────────────────────────────
async function loadSymbolsCompare(isFirst){
  try{
    const r = await fetch(API.symbolsCompare);
    const d = await r.json();
    symbolRows = d.symbols || [];
    lastLoadOk = true;
    setStatus(true);
    if (currentCategory === 'cex' && cexView !== 'strategy'){
      renderSymbolSidebar();
      const visible = symbolRows.filter(s => cexView === 'stock' ? s.is_stock : true);
      if (visible.length && (!currentSymbol || !visible.some(s => s.symbol === currentSymbol))){
        selectSymbol(visible[0].symbol);
      } else if (currentSymbol && currentSymbol === renderedSymbol && document.getElementById('symTabBody')){
        // 已经在看这个币的明细：只就地更新 KPI + 静默刷新当前 tab，
        // 不重建右侧、不把内容打回"加载中…"。
        patchSymbolKpis();
        loadSymTab({silent: true});
      } else if (currentSymbol){
        renderSymbolDetail();
        loadSymTab();
      }
    }
  }catch(e){
    setStatus(false);
    if (!lastLoadOk){
      document.getElementById('sidebarList').innerHTML = '<div class="empty-note">暂时连不上擂台服务，稍后自动重试…</div>';
    }
  }
}

function renderSymbolSidebar(){
  const list = document.getElementById('sidebarList');
  const rows = symbolRows.filter(s => cexView === 'stock' ? s.is_stock : true);
  if (!rows.length){ list.innerHTML = '<div class="empty-note">暂无数据</div>'; return; }
  list.innerHTML = rows.map((row, i) => {
    const pnl = row.total_pnl_usd;
    const tone = toneClass(pnl);
    const active = row.symbol === currentSymbol ? 'active' : '';
    const openTag = row.open_count > 0 ? `<div class="strat-open">● ${row.open_count} 笔持仓中</div>` : '';
    const sub = row.trades ? `${row.trades} 笔 · 胜率 ${row.win_rate != null ? row.win_rate+'%' : '–'}` : '暂无平仓';
    return `
      <div class="strat-row ${active}" data-symbol="${row.symbol}">
        <div class="strat-main">
          <div class="strat-rank">#${i+1}${row.is_stock ? ' · 美股' : ''}</div>
          <div class="strat-name">${row.symbol}</div>
          <div class="strat-open" style="color:var(--ink-faint)">${sub}</div>
          ${openTag}
        </div>
        <div class="strat-side">
          <div class="strat-ret ${tone}">${fmtUsdSimple(pnl)}</div>
        </div>
      </div>`;
  }).join('');
  list.querySelectorAll('.strat-row').forEach(el => {
    el.addEventListener('click', () => selectSymbol(el.dataset.symbol));
  });
}

function selectSymbol(symbol){
  currentSymbol = symbol;
  currentSymTab = 'strategies';
  renderSymbolSidebar();
  renderSymbolDetail();
  loadSymTab();
}

function renderSymbolDetail(){
  const row = symbolRows.find(r => r.symbol === currentSymbol);
  const inner = document.getElementById('detailInner');
  if (!row){ inner.innerHTML = '<div class="empty-note">选一个品种查看详情</div>'; renderedSymbol = null; return; }
  const tone = toneClass(row.total_pnl_usd);
  inner.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">${row.symbol}${row.is_stock ? ' <span style="font-size:14px;color:var(--ink-faint);font-weight:500;">· 代币化美股</span>' : ''}</div>
        <div class="detail-desc">跨全部 ${rosterRows.length || ''} 套战法在这个品种上的合并战绩——回答"这个品种被这堆公开战法整体做赚了还是做亏了"。净值是按策略记的，这里只看累计盈亏。</div>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="label">合并盈亏</div><div class="value ${tone}" id="symKpiPnl">${fmtUsdSimple(row.total_pnl_usd)}</div></div>
      <div class="kpi-card"><div class="label">胜率</div><div class="value" id="symKpiWin">${row.win_rate != null ? row.win_rate + '%' : '–'}</div></div>
      <div class="kpi-card"><div class="label">已平仓</div><div class="value" id="symKpiTrades">${row.trades ?? 0}</div></div>
      <div class="kpi-card"><div class="label">持仓中</div><div class="value" id="symKpiOpen">${row.open_count ?? 0}</div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${currentSymTab==='strategies'?'active':''}" data-stab="strategies">按策略</button>
      <button class="tab-btn ${currentSymTab==='open'?'active':''}" data-stab="open">持仓中</button>
      <button class="tab-btn ${currentSymTab==='closed'?'active':''}" data-stab="closed">平仓历史</button>
    </div>
    <div id="symTabBody"><div class="loading-row">加载中…</div></div>
  `;
  inner.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSymTab = btn.dataset.stab;
      inner.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      loadSymTab();
    });
  });
  renderedSymbol = currentSymbol;
}

function patchSymbolKpis(){
  const row = symbolRows.find(r => r.symbol === currentSymbol);
  if (!row) return;
  const p = document.getElementById('symKpiPnl');
  if (p){ p.textContent = fmtUsdSimple(row.total_pnl_usd); p.className = 'value ' + toneClass(row.total_pnl_usd); }
  const w = document.getElementById('symKpiWin');
  if (w) w.textContent = row.win_rate != null ? row.win_rate + '%' : '–';
  const t = document.getElementById('symKpiTrades');
  if (t) t.textContent = row.trades ?? 0;
  const o = document.getElementById('symKpiOpen');
  if (o) o.textContent = row.open_count ?? 0;
}

async function loadSymTab(opts){
  const silent = opts && opts.silent;
  const body = document.getElementById('symTabBody');
  if (!body || !currentSymbol) return;
  const seq = ++tabSeq;
  const sym = currentSymbol, tab = currentSymTab;
  if (!silent) body.innerHTML = '<div class="loading-row">加载中…</div>';
  let html;
  try{
    if (tab === 'strategies'){
      const d = await (await fetch(API.symbolStrategies(sym))).json();
      const rows = d.strategies || [];
      html = !rows.length ? '<div class="empty-note">这个品种还没有已平仓记录</div>'
        : `<div class="table-wrap"><table>
        <thead><tr><th>策略</th><th>笔数</th><th>胜率</th><th>累计盈亏</th></tr></thead>
        <tbody>${rows.map(s => `<tr><td>${s.strategy}</td><td>${s.trades}</td>
          <td>${s.win_rate != null ? s.win_rate+'%' : '–'}</td>
          <td class="num ${toneClass(s.total_pnl_usd)}">${fmtUsdSimple(s.total_pnl_usd)}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      const status = tab === 'open' ? 'open' : 'closed';
      const d = await (await fetch(API.symbolPositions(sym, status))).json();
      const rows = d.positions || [];
      html = !rows.length ? `<div class="empty-note">暂无${status==='open'?'持仓中':'已平仓'}记录</div>`
        : (status === 'open' ? _posOpenTable(rows, '策略', 'strategy') : _posClosedTable(rows, '策略', 'strategy'));
    }
  }catch(e){
    if (!silent && seq === tabSeq) body.innerHTML = '<div class="empty-note">加载失败，稍后自动重试…</div>';
    return;
  }
  if (seq === tabSeq && sym === currentSymbol && tab === currentSymTab && document.getElementById('symTabBody')){
    document.getElementById('symTabBody').innerHTML = html;
  }
}

function switchCexView(view){
  if (view === cexView) return;
  cexView = view;
  currentSymbol = null;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('sidebarLabel').textContent =
    view === 'strategy' ? '按收益率排名' : (view === 'stock' ? '美股 · 按合并盈亏' : '币种 · 按合并盈亏');
  if (view === 'strategy'){
    renderSidebar();
    if (currentStrategy){ renderDetailHeader(); loadTab(); }
    else document.getElementById('detailInner').innerHTML = '<div class="empty-note">选一套策略查看详情</div>';
  } else {
    document.getElementById('detailInner').innerHTML = '<div class="loading-row">加载中…</div>';
    loadSymbolsCompare(true);
  }
}

// ── 链上数据分类 ─────────────────────────────────────────────────────────
function walletKey(w){ return `${w.address}|${w.chain}`; }

function renderChainSidebar(){
  const list = document.getElementById('sidebarList');
  const overviewActive = currentWallet === null ? 'active' : '';
  const rows = [`
    <div class="strat-row ${overviewActive}" data-wallet="__overview__">
      <div class="strat-main"><div class="strat-name">总览</div></div>
      <div class="strat-ret flat">${chainWallets.length} 个地址</div>
    </div>`];
  chainWallets.forEach(w => {
    const active = currentWallet === walletKey(w) ? 'active' : '';
    const short = w.address.length > 10 ? `${w.address.slice(0,4)}…${w.address.slice(-4)}` : w.address;
    rows.push(`
      <div class="strat-row ${active}" data-wallet="${walletKey(w)}">
        <div class="strat-main">
          <div class="strat-name">${w.label || short}</div>
          <div class="strat-open wallet-addr">${short} · ${w.chain}</div>
        </div>
        <div class="strat-ret flat">${w.event_count || 0} 事件</div>
      </div>`);
  });
  list.innerHTML = rows.join('');
  list.querySelectorAll('.strat-row').forEach(el => {
    el.addEventListener('click', () => {
      currentWallet = el.dataset.wallet === '__overview__' ? null : el.dataset.wallet;
      renderChainSidebar();
      renderChainDetail();
    });
  });
}

async function loadChain(isFirst){
  try{
    const [ovR, wR] = await Promise.all([fetch(API.chainOverview), fetch(API.chainWallets)]);
    chainOverview = await ovR.json();
    const wd = await wR.json();
    chainWallets = wd.wallets || [];
    lastLoadOk = true;
    setStatus(true);
    if (currentCategory === 'chain'){
      renderChainSidebar();
      renderChainDetail();
    }
  }catch(e){
    setStatus(false);
    if (!lastLoadOk && currentCategory === 'chain'){
      document.getElementById('sidebarList').innerHTML = '<div class="empty-note">暂时连不上链上数据服务，稍后自动重试…</div>';
    }
  }
}

async function renderChainDetail(){
  const inner = document.getElementById('detailInner');
  if (!chainOverview || !chainOverview.available){
    inner.innerHTML = '<div class="empty-note">链上数据服务还没连上，或者数据库还没生成——chain_sniper正在启动中</div>';
    return;
  }
  if (currentWallet === null){
    const ks = chainOverview.kill_switch_active
      ? '<span class="badge-live" style="color:var(--bad);">⛔ 熔断已触发</span>'
      : '<span class="badge-live">● 正常运行</span>';
    inner.innerHTML = `
      <div class="detail-head">
        <div>
          <div class="detail-title">链上聪明钱监察</div>
          <div class="detail-desc">追踪种子聪明钱地址的链上买卖行为，模拟观察+模拟开单跟踪，不做真实下单(DRY_RUN)。区别于上方"中心化交易所"分类——那是纸面模拟CEX战法，这里是链上信号驱动的独立观察体系。</div>
        </div>
        ${ks}
      </div>
      <div class="kpi-row">
        <div class="kpi-card"><div class="label">监察地址</div><div class="value">${chainOverview.watched_wallets}</div></div>
        <div class="kpi-card"><div class="label">持仓中</div><div class="value">${chainOverview.open_positions}</div></div>
        <div class="kpi-card"><div class="label">已平仓</div><div class="value">${chainOverview.closed_trades}</div></div>
        <div class="kpi-card"><div class="label">胜率</div><div class="value">${chainOverview.win_rate != null ? chainOverview.win_rate+'%' : '–'}</div></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-ctab="open">持仓中</button>
        <button class="tab-btn" data-ctab="closed">平仓历史</button>
      </div>
      <div id="chainTabBody"><div class="loading-row">加载中…</div></div>
    `;
    inner.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        inner.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        loadChainPositionsTab(btn.dataset.ctab);
      });
    });
    loadChainPositionsTab('open');
    return;
  }

  const w = chainWallets.find(x => walletKey(x) === currentWallet);
  if (!w){ inner.innerHTML = '<div class="empty-note">选一个地址查看详情</div>'; return; }
  inner.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">${w.label || '未命名地址'}</div>
        <div class="detail-desc wallet-addr">${w.address} · ${w.chain}</div>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="label">链上事件</div><div class="value">${w.event_count || 0}</div></div>
      <div class="kpi-card"><div class="label">加入日期</div><div class="value" style="font-size:16px;">${w.added_at ? new Date(w.added_at*1000).toLocaleDateString('zh-CN') : '–'}</div></div>
      <div class="kpi-card"><div class="label">状态</div><div class="value" style="font-size:16px;">${w.active ? '监察中' : '已停用'}</div></div>
      <div class="kpi-card"><div class="label">最近事件</div><div class="value" style="font-size:16px;">${w.last_event_ts ? new Date(w.last_event_ts*1000).toLocaleDateString('zh-CN') : '暂无'}</div></div>
    </div>
    <div class="empty-note">该地址的逐笔链上事件明细——种子名单/事件量随宝贝陆续添加聪明钱地址增长</div>
  `;
}

async function loadChainPositionsTab(status){
  const body = document.getElementById('chainTabBody');
  if (!body) return;
  body.innerHTML = '<div class="loading-row">加载中…</div>';
  const r = await fetch(API.chainPositions(status));
  const d = await r.json();
  const rows = d.positions || [];
  if (!rows.length){ body.innerHTML = `<div class="empty-note">暂无${status==='open'?'持仓中':'已平仓'}记录</div>`; return; }
  if (status === 'open'){
    body.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>链</th><th>代币地址</th><th>入场价</th><th>止盈</th><th>止损</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td>${p.chain}</td><td class="wallet-addr">${p.token_address}</td>
        <td>${p.entry_price}</td><td>${p.tp_price}</td><td>${p.sl_price}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    body.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>链</th><th>代币地址</th><th>入场价</th><th>出场价</th><th>盈亏</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td>${p.chain}</td><td class="wallet-addr">${p.token_address}</td>
        <td>${p.entry_price}</td><td>${p.exit_price ?? '–'}</td>
        <td class="num ${toneClass(p.realized_pnl_usd)}">${fmtUsdSimple(p.realized_pnl_usd)}</td></tr>`).join('')}</tbody></table></div>`;
  }
}

function switchCategory(cat){
  if (cat === currentCategory) return;
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.getElementById('topStats').style.display = cat === 'cex' ? '' : 'none';
  document.getElementById('viewToggle').style.display = cat === 'cex' ? '' : 'none';
  if (cat === 'cex'){
    if (cexView === 'strategy'){
      document.getElementById('sidebarLabel').textContent = '按收益率排名';
      renderSidebar();
      if (currentStrategy){ renderDetailHeader(); loadTab(); }
      else document.getElementById('detailInner').innerHTML = '<div class="empty-note">选一套策略查看详情</div>';
    } else {
      document.getElementById('sidebarLabel').textContent = cexView === 'stock' ? '美股 · 按合并盈亏' : '币种 · 按合并盈亏';
      loadSymbolsCompare(true);
    }
  } else {
    document.getElementById('sidebarLabel').textContent = '监察地址';
    renderChainSidebar();
    renderChainDetail();
    if (!chainOverview) loadChain(true);
  }
}

async function loadCompare(isFirst){
  try{
    const r = await fetch(API.compare);
    const d = await r.json();
    rosterRows = d.strategies || [];
    lastLoadOk = true;
    setStatus(true);
    if (currentCategory === 'cex' && cexView === 'strategy'){
      renderSidebar();
      if (isFirst && rosterRows.length){
        selectStrategy(rosterRows[0].strategy);
      } else if (currentStrategy){
        if (currentStrategy === renderedStrategy && document.getElementById('tabBody')){
          // 面板已经在展示这个策略：只就地更新 KPI 数字 + 静默刷新当前
          // tab(不闪"加载中…")，用户正在看的表格不被打断。
          patchStrategyKpis();
          loadTab({silent: true});
        } else {
          renderDetailHeader();
          loadTab();
        }
      }
    }
  }catch(e){
    setStatus(false);
    if (!lastLoadOk){
      document.getElementById('sidebarList').innerHTML = '<div class="empty-note">暂时连不上擂台服务，稍后自动重试…</div>';
    }
  }
}

function setStatus(ok){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (ok){
    dot.classList.remove('stale');
    text.textContent = '实时 · ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  } else {
    dot.classList.add('stale');
    text.textContent = '连接中断，重试中';
  }
}

function selectStrategy(strategy){
  currentStrategy = strategy;
  currentTab = 'symbols';
  renderSidebar();
  renderDetailHeader();
  loadTab();
}

function renderDetailHeader(){
  const row = rosterRows.find(r => r.strategy === currentStrategy);
  const inner = document.getElementById('detailInner');
  if (!row){ inner.innerHTML = '<div class="empty-note">选一套策略查看详情</div>'; renderedStrategy = null; return; }
  const tone = toneClass(row.equity_return_pct);
  inner.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">${row.strategy}</div>
        <div class="detail-desc">${row.description || '暂无说明'}</div>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="label">收益率</div><div class="value ${tone}" id="kpiRet">${fmtPct(row.equity_return_pct)}</div></div>
      <div class="kpi-card"><div class="label">胜率</div><div class="value" id="kpiWin">${row.win_rate != null ? row.win_rate + '%' : '–'}</div></div>
      <div class="kpi-card"><div class="label">已平仓</div><div class="value" id="kpiTrades">${row.trades ?? 0}</div></div>
      <div class="kpi-card"><div class="label">净值</div><div class="value" id="kpiEq">${fmtUsd0(row.equity ?? 0)}</div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${currentTab==='symbols'?'active':''}" data-tab="symbols">按品种</button>
      <button class="tab-btn ${currentTab==='open'?'active':''}" data-tab="open">持仓中</button>
      <button class="tab-btn ${currentTab==='closed'?'active':''}" data-tab="closed">平仓历史</button>
    </div>
    <div id="tabBody"><div class="loading-row">加载中…</div></div>
  `;
  inner.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      inner.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      loadTab();
    });
  });
  renderedStrategy = currentStrategy;
}

function patchStrategyKpis(){
  const row = rosterRows.find(r => r.strategy === currentStrategy);
  if (!row) return;
  const ret = document.getElementById('kpiRet');
  if (ret){ ret.textContent = fmtPct(row.equity_return_pct); ret.className = 'value ' + toneClass(row.equity_return_pct); }
  const win = document.getElementById('kpiWin');
  if (win) win.textContent = row.win_rate != null ? row.win_rate + '%' : '–';
  const tr = document.getElementById('kpiTrades');
  if (tr) tr.textContent = row.trades ?? 0;
  const eq = document.getElementById('kpiEq');
  if (eq) eq.textContent = fmtUsd0(row.equity ?? 0);
}

function _posOpenTable(rows, firstCol, firstColKey){
  return `<div class="table-wrap"><table>
    <thead><tr><th>${firstCol}</th><th>方向</th><th>买入时间</th><th>入场价</th><th>现价</th><th>浮动盈亏</th></tr></thead>
    <tbody>${rows.map(p => `<tr><td>${p[firstColKey]}</td><td>${p.side}</td>
      <td>${fmtTime(p.entry_bar_time)}</td><td>${p.entry}</td>
      <td>${p.current_price ?? '–'}</td>
      <td class="num ${toneClass(p.unrealized_pnl_usd)}">${fmtUsdSimple(p.unrealized_pnl_usd)}</td></tr>`).join('')}</tbody></table></div>`;
}
function _posClosedTable(rows, firstCol, firstColKey){
  return `<div class="table-wrap"><table>
    <thead><tr><th>${firstCol}</th><th>方向</th><th>买入时间</th><th>平仓时间</th><th>入场价</th><th>出场价</th><th>出场原因</th><th>盈亏</th></tr></thead>
    <tbody>${rows.map(p => {
      const pnl = p.realized_pnl_atr_weighted != null && p.atr0 && p.qty ? p.realized_pnl_atr_weighted*p.atr0*p.qty : null;
      const exitMs = p.exit_bar_time || (p.closed_at ? p.closed_at*1000 : null);
      return `<tr><td>${p[firstColKey]}</td><td>${p.side}</td>
        <td>${fmtTime(p.entry_bar_time)}</td><td>${fmtTime(exitMs)}</td>
        <td>${p.entry}</td><td>${p.exit_price ?? '–'}</td>
        <td>${p.exit_reason || '–'}</td>
        <td class="num ${toneClass(pnl)}">${fmtUsdSimple(pnl)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

async function loadTab(opts){
  const silent = opts && opts.silent;
  const body = document.getElementById('tabBody');
  if (!body || !currentStrategy) return;
  const seq = ++tabSeq;
  const strat = currentStrategy, tab = currentTab;
  if (!silent) body.innerHTML = '<div class="loading-row">加载中…</div>';
  let html;
  try{
    if (tab === 'symbols'){
      const d = await (await fetch(API.symbols(strat))).json();
      const rows = d.symbols || [];
      html = !rows.length ? '<div class="empty-note">这套策略还没有已平仓的品种数据</div>'
        : `<div class="table-wrap"><table>
        <thead><tr><th>品种</th><th>笔数</th><th>胜率</th><th>累计盈亏</th></tr></thead>
        <tbody>${rows.map(s => {
          const wr = s.trades ? Math.round(100*(s.wins||0)/s.trades) : null;
          return `<tr><td>${s.symbol}</td><td>${s.trades}</td><td>${wr!=null? wr+'%':'–'}</td>
            <td class="num ${toneClass(s.total_pnl_usd)}">${fmtUsdSimple(s.total_pnl_usd)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    } else {
      const status = tab === 'open' ? 'open' : 'closed';
      const d = await (await fetch(API.positions(strat, status))).json();
      const rows = d.positions || [];
      html = !rows.length ? `<div class="empty-note">暂无${status==='open'?'持仓中':'已平仓'}记录</div>`
        : (status === 'open' ? _posOpenTable(rows, '品种', 'symbol') : _posClosedTable(rows, '品种', 'symbol'));
    }
  }catch(e){
    if (!silent && seq === tabSeq) body.innerHTML = '<div class="empty-note">加载失败，稍后自动重试…</div>';
    return;
  }
  // 只有还停在同一个策略/同一个 tab、且没有更新的请求发出，才写回——
  // 防止慢响应盖掉用户已经切走的内容(那也会看起来"不稳定")。
  if (seq === tabSeq && strat === currentStrategy && tab === currentTab && document.getElementById('tabBody')){
    document.getElementById('tabBody').innerHTML = html;
  }
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => switchCategory(btn.dataset.cat));
});
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => switchCexView(btn.dataset.view));
});

function refreshCurrent(isFirst){
  if (currentCategory !== 'cex'){ loadChain(isFirst); return; }
  if (cexView === 'strategy') loadCompare(isFirst);
  else loadSymbolsCompare(isFirst);
}

loadMeta();
loadCompare(true);
setInterval(() => refreshCurrent(false), 30000);
// 首次加载若失败，尽快重试一次，不用等满30秒才恢复
setTimeout(() => { if (!lastLoadOk) refreshCurrent(true); }, 3000);
</script>
